name: YouTube Transcript

on:
  issues:
    types: [opened]

jobs:
  extract:
    if: startsWith(github.event.issue.title, '[transcript] ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse video ID
        env:
          REQUEST_TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$REQUEST_TITLE" =~ ^\[transcript\][[:space:]]([A-Za-z0-9_-]{11})$ ]]; then
            echo "VIDEO_ID=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          else
            echo "Invalid transcript request title"
            exit 1
          fi

      - run: npm install

      - name: Extract transcript
        run: npm run extract

      - name: Upload transcript
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ env.VIDEO_ID }}
          path: |
            transcript.json
            transcript.txt
          retention-days: 1
          if-no-files-found: error
