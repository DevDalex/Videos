name: YouTube Transcript

on:
  issues:
    types: [opened]

jobs:
  extract:
    if: startsWith(github.event.issue.title, '[transcript] ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse video ID
        env:
          REQUEST_TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$REQUEST_TITLE" =~ ^\[transcript\][[:space:]]([A-Za-z0-9_-]{11})$ ]]; then
            echo "VIDEO_ID=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          else
            echo "Invalid transcript request title"
            exit 1
          fi

      - run: npm install

      - name: Try YouTube captions
        id: captions
        continue-on-error: true
        run: npm run extract

      - name: Try YouTube.js audio download
        id: youtube_audio
        if: steps.captions.outcome == 'failure'
        continue-on-error: true
        run: npx tsx scripts/download_audio.ts

      - uses: actions/setup-python@v5
        if: steps.captions.outcome == 'failure'
        with:
          python-version: '3.12'

      - name: Install Whisper fallback
        if: steps.captions.outcome == 'failure'
        run: python -m pip install --upgrade faster-whisper yt-dlp

      - name: Prepare YouTube cookies
        if: steps.captions.outcome == 'failure' && steps.youtube_audio.outcome == 'failure'
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -n "$YOUTUBE_COOKIES_B64" ]; then
            printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > youtube-cookies.txt
            chmod 600 youtube-cookies.txt
            echo "COOKIE_ARGS=--cookies youtube-cookies.txt" >> "$GITHUB_ENV"
          else
            echo "COOKIE_ARGS=" >> "$GITHUB_ENV"
          fi

      - name: Try yt-dlp audio download
        if: steps.captions.outcome == 'failure' && steps.youtube_audio.outcome == 'failure'
        run: |
          yt-dlp             --no-playlist             -x             --audio-format mp3             --write-info-json             $COOKIE_ARGS             -o "audio.%(ext)s"             "https://www.youtube.com/watch?v=$VIDEO_ID"

      - name: Transcribe audio with Whisper
        if: steps.captions.outcome == 'failure'
        env:
          WHISPER_MODEL: base
        run: python scripts/transcribe_audio.py

      - name: Upload transcript
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ env.VIDEO_ID }}
          path: |
            transcript.json
            transcript.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove temporary authentication file
        if: always()
        run: rm -f youtube-cookies.txt

      - name: Redact and close request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --title "[processed]" --body ""
          gh issue close "$ISSUE_NUMBER"
